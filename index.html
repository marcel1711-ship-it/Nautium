<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===================== FAVICON ===================== -->
    <!-- Reemplaza con un archivo .ico o .png real en /public -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23051826'/%3E%3Ctext x='32' y='41' font-family='Georgia%2C serif' font-size='34' font-weight='700' fill='%2338bdf8' text-anchor='middle'%3EN%3C/text%3E%3Cpath d='M12 53 Q20 48 26 53 Q32 58 38 53 Q44 48 52 53' stroke='%2338bdf8' stroke-width='2.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />

    <!-- ===================== PRIMARY SEO ===================== -->
    <title>Nautium — Yacht Fleet Management Software</title>
    <meta name="description" content="Nautium is the all-in-one platform to manage yacht maintenance, inventory and operational costs with real-time visibility. Every vessel under control." />
    <meta name="keywords" content="yacht management software, fleet maintenance, boat inventory, yacht maintenance tracking, vessel management, maritime software, yacht operational costs" />
    <meta name="author" content="Nautium" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.nautium.app/" />

    <!-- ===================== OPEN GRAPH ===================== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nautium" />
    <meta property="og:url" content="https://www.nautium.app/" />
    <meta property="og:title" content="Nautium — Yacht Fleet Management Software" />
    <meta property="og:description" content="Manage maintenance, inventory and operational costs for your yacht. Real-time visibility. Every vessel under control." />
    <meta property="og:image" content="https://www.nautium.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nautium — Luxury superyacht at golden hour sunset" />
    <meta property="og:locale" content="en_US" />

    <!-- ===================== TWITTER / X ===================== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nautiumapp" />
    <meta name="twitter:title" content="Nautium — Yacht Fleet Management Software" />
    <meta name="twitter:description" content="Manage maintenance, inventory and operational costs for your yacht. Real-time visibility." />
    <meta name="twitter:image" content="https://www.nautium.app/og-image.jpg" />
    <meta name="twitter:image:alt" content="Nautium — Luxury superyacht at golden hour sunset" />

    <!-- ===================== SCHEMA.ORG (JSON-LD) ===================== -->
    <!-- Esto hace que Google muestre info rica en resultados de búsqueda -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Nautium",
      "url": "https://www.nautium.app",
      "logo": "https://www.nautium.app/logo.png",
      "description": "All-in-one platform to manage yacht maintenance, inventory and operational costs with real-time visibility.",
      "applicationCategory": "WebApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free trial available"
      },
      "featureList": [
        "Maintenance tracking",
        "Inventory management",
        "Spare parts control",
        "Operational cost tracking",
        "Reports and history"
      ],
      "screenshot": "https://www.nautium.app/og-image.jpg",
      "sameAs": [
        "https://twitter.com/nautiumapp",
        "https://www.linkedin.com/company/nautium"
      ]
    }
    </script>

    <!-- ===================== PERFORMANCE ===================== -->
    <!-- Preconnect a fuentes o servicios externos que uses -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Theme color para mobile browsers (barra del navegador) -->
    <meta name="theme-color" content="#051826" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
